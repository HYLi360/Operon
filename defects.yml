- id: ODR-0026
  title: A condition's operator composes as blank when a Select could not finish mounting
  reported: '2026-09-19'
  introduced_in: 0.8.3
  affected: 'the classification editor''s condition operators, and any Select the
    FittingSelect mount guard covers, when Textual''s mount-time lookup fails; seen
    on CI only, under load'
  severity: high
  component: tui
  status: verified
  reproduction: 'CI run 35434598469 (head f1fd525) failed
    tests/unit/test_tui_config.py::test_config_classification_editor_end_to_end on
    ubuntu-latest 3.12 and 3.13: the composed document held
    ``{"field": "short_name", "operator": "", "value": "bHLH%"}`` where the file
    said ``"operator": "like"``.  Textual''s ``Select._on_mount`` calls
    ``_setup_options_renderables`` — which queries ``SelectOverlay`` — *before*
    ``_init_selected_option`` stores the value the control was built with, so the
    guard added for ODR-0023 deferred both steps and left ``value`` at ``NULL``,
    which the editor reads as an empty operator.  The same read reported whole rank
    maps as ``0.0``/``1.0`` because ``BestByRow`` parsed them with ``float``.'
