- id: ODR-0030
  title: Old editor rows falsely satisfy readiness during a deferred form replacement
  reported: '2026-09-20'
  introduced_in: null
  affected: 0.8.4; rebuilding an already populated config editor and requesting save before
    deferred replacement completes, or two renders arriving before the first replacement lands
  severity: high
  component: tui
  status: fixed
  reproduction: On Python 3.14.4 and Textual 8.2.8, render BHLH_PROFILE with _render_profile_document
    and await readiness. Render the same document with a new description and first rule label
    CHANGED, then call _form_mounting and _start_classification_save synchronously before
    yielding. _form_mounting returns false and ClassificationSaveModal.document contains the
    new description but old labels A/U/C. After refresh the editor contains CHANGED/U/C. No
    save was confirmed. remount defers insertion, while MountTracked.mounts_settled clears
    its latch upon seeing any existing child, including old rows awaiting removal. Second
    audit round (2026-09-21) used reports/tui-timing-audit-2026-09-20/probe_two_selections.py
    and delivered two selections in one message-loop turn, the way the handler that reads the
    live event.list_view.index receives queued messages — both generations survive rather
    than mixing; 13 .rule-row widgets for a profile whose file holds 6 required + 3 warnings,
    _form_mounting() false, and ProfileSaveModal then composes 7 required + 6 warnings, so a
    confirmed save would write a duplicated profile. Two enter presses one turn apart did not
    reproduce it.
  disposition: Fixed in operon/tui/screens/common.py.  MountTracked now retires the generation it is
    replacing before it mounts the next one and stamps each replacement with a generation token, so a
    replacement that is superseded while its removal is in flight drops its mount instead of adding a
    second generation.  mounts_settled reports false until the replacement the editor is waiting for
    has landed, with an _EMPTIED sentinel keeping a populated-to-empty replacement in that waiting
    state, and _replacing() keeps readiness false while a previous generation is still in the tree.
    Two selections delivered in one turn now leave one generation of rows, the readiness check reads
    the rows the user sees, and the save modal composes the profile file's own rules.  The regression
    test drives two rebuilds inside one turn and then saves, asserting one generation of rows and a
    document equal to the file's.
  fix_commit: ed6e199d9cebf8e2ac86749c1c7bf3afa73eab96
  fixed_in: null
  regression_tests:
  - tests/unit/test_tui_config.py::test_two_editor_rebuilds_in_one_turn_leave_one_generation
- id: ODR-0031
  title: Detail panes apply a worker result that no longer matches the selection
  reported: '2026-09-21'
  introduced_in: null
  affected: 0.8.4; files and entities detail panes when two highlights arrive closer together
    than the first read takes
  severity: medium
  component: tui
  status: fixed
  reproduction: 'Controlled probe (reports/tui-timing-audit-2026-09-20/probe_lifecycle.py,
    the stale-detail scenario). Stub data.file_detail so the read for FIL_000002 sleeps 0.6
    s, highlight FIL_000002 and one turn later FIL_000003 in the Files table, then let the
    app settle. The reads finish out of order (FIL_000003 at 14.983 s, FIL_000002 at 15.468
    s) and the pane renders file FIL_000002 while the table highlights FIL_000003 —
    pane_names_highlighted false and pane_names_slow true. FilesPanel._load_detail is
    @work(thread=True, exclusive=True, group="file-detail"), and exclusive cancels the
    previous worker await rather than its thread; the thread still calls
    post_to_ui(self._apply_detail, payload) with no request identity, so the last payload to
    arrive wins. EntitiesPanel._load_detail has the same shape, as do the coverage and
    publish preview workers.'
  disposition: Fixed.  WorkerResults stamps every request with a key and panels hand the key to the
    worker result (post_to_ui(..., key=...) on the thread side, apply_from_worker(..., key=...) in the
    panel), so a payload that arrives after a newer request was stamped is dropped instead of rendered.
    A result without a key and a widget that never stamped one are both treated as current, so the
    mechanism is inert for workers that do not opt in.  Panel.begin_request() + is_current_result()
    are the two halves; FilesPanel and EntitiesPanel stamp file_id or the entity key, CoveragePanel
    stamps the report id, and PublishPanel stamps the release profile and the export filter tuple.
  fix_commit: 2384e2c37a7a4ef3768113bc88de376822f91d41
  fixed_in: null
  regression_tests:
  - tests/unit/test_tui_screens_more.py::test_files_detail_drops_a_read_a_newer_selection_superseded
  - tests/unit/test_tui_screens_more.py::test_entity_detail_drops_a_read_a_newer_node_superseded
  - tests/unit/test_tui_publish.py::test_coverage_report_drops_a_read_a_newer_row_superseded
  - tests/unit/test_tui_publish.py::test_release_preview_drops_a_read_a_newer_profile_superseded
  - tests/unit/test_tui_publish.py::test_export_preview_drops_a_read_a_newer_filter_set_superseded
- id: ODR-0032
  title: A dropped initial panel render leaves the app on the splash screen
  reported: '2026-09-21'
  introduced_in: null
  affected: 0.8.4; any panel whose first render is dropped by a lookup failure during startup
  severity: medium
  component: tui
  status: fixed
  reproduction: 'Controlled probe (reports/tui-timing-audit-2026-09-20/probe_lifecycle.py,
    the dropped-initial-load scenario). Make HomePanel.render_data raise NoMatches once.
    Panel._apply returns on its (MountError, NoMatches) guard before it latches
    initial_load_complete, and OperonApp._finish_startup waits for every panel to latch with
    no deadline, so the probe reports starting true, screen SplashScreen, splash_status
    "Loading Home...", home_initial_load_complete false and workers [RUNNING], and nothing
    changes afterwards. In a test run every _settled then times out with RUNNING; in
    production the panels stay unreachable and the only way out is ctrl+q. The panel-level
    test test_panel_drops_a_result_whose_widgets_are_gone pins the dropped result as intended
    for teardown, which a live render failure is indistinguishable from.'
  disposition: 'Fixed in operon/tui/screens/common.py and operon/tui/app.py.  Panel._apply still drops
    a result whose widgets are gone, but a dropped result no longer returns before the app is told
    that the panel first load is over — the initial-load state latches either way, so a live render
    failure is reported instead of parking the splash.  OperonApp._finish_startup stops waiting for
    panels that never report at all: after startup_deadline seconds it shows what did load, logs the
    panels that did not, pops the splash and notifies the user that r retries.  The deadline is
    covered by stepping the app clock (a frozen clock cannot show elapsed time), and the panel-level
    test parametrises both drop shapes, MountError and NoMatches.'
  fix_commit: 7f73c472728ccfc34a7aab6f255d1051e45a2adf
  fixed_in: null
  regression_tests:
  - tests/unit/test_tui.py::test_splash_leaves_when_a_panel_drops_its_first_render
  - tests/unit/test_tui.py::test_splash_leaves_after_the_startup_deadline
  - tests/unit/test_tui_screens_more.py::test_panel_drops_a_result_whose_widgets_are_gone
- id: ODR-0033
  title: Environment-capture tests assert a raw path that capture redacts under $HOME
  reported: '2026-09-21'
  introduced_in: null
  affected: 'test infrastructure only, no shipped behavior: the three conda_prefix assertions
    in tests/unit/test_environment_capture.py whenever the scratch directory (TMPDIR) sits
    inside the home directory'
  severity: low
  component: tests
  status: fixed
  reproduction: 'Cross-version matrix run on 7f73c472728ccfc34a7aab6f255d1051e45a2adf, leg
    Python 3.12.14, TMPDIR under the home directory (/home/hyli360/.hermes/cache/scratch/pytest-of-…):
    the leg reported 3 failed, 1936 passed, each failure the same shape — the capture recorded
    ''~/.hermes/cache/scratch/…/tool env'' while the test compared it with the raw absolute
    path ''/home/hyli360/.hermes/cache/scratch/…/tool env'' in assert env["conda_prefix"] ==
    fake_conda[-1]. Capture-time redaction collapses whole-segment home prefixes
    (environment._redact_home), so the assertions only hold while the scratch directory is
    outside $HOME — which every scripted run except an unstamped matrix leg arranges. The
    3.10/3.11 legs of that run and CI never saw it.'
  disposition: 'Fixed in tests/unit/test_environment_capture.py. The three assertions compare
    against the capture''s own form of the path, a new _captured() helper that applies
    environment._redact_home with environment._local_home() to the expected value, so they hold
    wherever the scratch directory lives; a run whose TMPDIR is inside $HOME is now a condition
    the matrix exercises instead of one it trips on. The three tests carry
    @pytest.mark.bug("ODR-0033").'
  fix_commit: null
  fixed_in: null
  regression_tests:
  - tests/unit/test_environment_capture.py::test_actual_target_environment_and_workflow_roundtrip
  - tests/unit/test_environment_capture.py::test_slurm_probe_runs_after_setup_inside_launcher
  - tests/unit/test_environment_capture.py::test_direct_ssh_captures_target_and_removes_raw_probe
