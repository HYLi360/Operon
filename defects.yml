    (``_adopt_value_before_overlay``) and publishes ``options_ready``, which
    ``ConfigPanel._form_mounting`` now requires of every Select in the form, so a
    reader waits instead of composing a blank operator; ``BestByRow`` parses rank
    values and defaults through ``actions.coerce_scalar``, keeping whole numbers
    whole.'
