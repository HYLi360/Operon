# Read the Docs build configuration for the parent documentation project
# (`operonproject`), which publishes the English tree at
# https://operonproject.readthedocs.io/en/latest/ .
#
# Read the Docs accepts no build-configuration file name other than
# `.readthedocs.yaml`, so each language keeps one next to its `conf.py` and its
# project names that path in Admin -> Settings -> `Build configuration file`:
# `docs/en/.readthedocs.yaml` for this project, `docs/zh/.readthedocs.yaml` for
# the Chinese translation project (`operonproject-zh`), which is linked to this
# project on its Translations page and then served under this project's domain
# with the language prefix. See docs/en/contributor/documentation-deployment.md.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  # Read the Docs runs Sphinx from the directory holding this file, so
  # `docs/en/` is both the configuration directory and the source directory.
  # Paths elsewhere in this file stay relative to the repository root.
  configuration: docs/en/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
