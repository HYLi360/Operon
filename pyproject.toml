[build-system]
requires = ["setuptools>=68", "cx-Freeze>=8.4"]
build-backend = "setuptools.build_meta"

[project]
name = "operon"
version = "0.4.0"
description = "Operon the System: Archive, Quality-Control, Organize, Analyze and Release Your Bio-Data"
authors = [
    { name = "hyli360", email = "lihuanyu2003@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# We don't plan on making it FOSS just yet.
# license = { text = "MIT" }

dependencies = [
    "aiohttp>=3.9",
    "biopython>=1.85",
    "PyYAML>=6.0",
    "questionary>=2.1",
    "requests>=2.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build = ["cx-Freeze>=8.4", "paramiko>=3.4"]
remote = ["paramiko>=3.4"]
dev = ["pytest>=8.0", "cx-Freeze>=8.4", "paramiko>=3.4"]

[project.scripts]
operon = "operon.cli:main"

[tool.setuptools.packages.find]
include = ["operon*"]

[tool.cxfreeze]
executables = [
    { script = "operon/__main__.py", target_name = "operon" },
]

[tool.cxfreeze.build_exe]
build_exe = "build/release/v0.4.0"
packages = ["operon", "yaml", "requests", "aiohttp", "Bio", "paramiko", "questionary", "prompt_toolkit", "wcwidth"]
include_files = [
    ["README.md", "share/doc/operon/README.md"],
    ["docs", "share/doc/operon/docs"],
]
excludes = ["pytest", "setuptools", "unittest"]
optimize = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
    "unit: isolated domain tests",
    "integration: tests spanning multiple components",
    "regression: correctness regressions",
    "compatibility: supported Python and database compatibility contracts",
]
