[build-system]
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OperonDBS"
version = "0.7.2"
description = "Operon the Database System: Archive, Quality-Control, Organize, Analyze and Release Your Bio-Data"
authors = [
    { name = "hyli360", email = "lihuanyu2003@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]

license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "aiohttp>=3.9",
    "biopython>=1.85",
    "paramiko>=3.4",
    "PyYAML>=6.0",
    "questionary>=2.1",
    "requests>=2.32",
    "textual>=8.0",
]

[project.urls]
Repository = "https://github.com/HYLi360/Operon"
Issues = "https://github.com/HYLi360/Operon/issues"

[project.optional-dependencies]
test = [
    "coverage>=7.0",
    "cython>=3.0",
    "paramiko>=3.4",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "setuptools>=77",
    "textual>=8.0",
]
docs = [
    "Sphinx>=7.4,<9",
    "myst-parser>=4.0,<5",
    "sphinx-rtd-theme>=3.0,<4",
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    "coverage>=7.0",
    "cython>=3.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "setuptools>=77",
    "tomli>=2.0; python_version < '3.11'",
    "Sphinx>=7.4,<9",
    "myst-parser>=4.0,<5",
    "sphinx-rtd-theme>=3.0,<4",
]

[project.scripts]
operon = "operon.cli:main"

[tool.setuptools.packages.find]
include = ["operon*"]

[tool.setuptools.package-data]
"operon.tui" = ["*.tcss", "assets/*.png", "assets/*.z", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
addopts = [
    "--cov=operon",
    "--cov-branch",
    "--cov-report=xml",
    "--junitxml=junit.xml",
    "-o",
    "junit_family=legacy",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: isolated domain tests",
    "integration: tests spanning multiple components",
    "regression: correctness regressions",
    "compatibility: supported Python and database compatibility contracts",
]

[tool.coverage.run]
branch = true
source = ["operon"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 90
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]