[build-system]
requires = ["setuptools>=77", "cx-Freeze>=8.4", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "operon"
version = "0.6.0"
description = "Operon the System: Archive, Quality-Control, Organize, Analyze and Release Your Bio-Data"
authors = [
    { name = "hyli360", email = "lihuanyu2003@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "aiohttp>=3.9",
    "biopython>=1.85",
    "Cython>=3.0",
    "PyYAML>=6.0",
    "questionary>=2.1",
    "requests>=2.32",
]

[project.optional-dependencies]
test = ["coverage>=7.0", "paramiko>=3.4", "pytest-cov>=7.0", "pytest>=8.0", "setuptools>=77"]
build = [
    "cx-Freeze>=8.4",
    "paramiko>=3.4",
    "tomli>=2.0; python_version < '3.11'",
]
remote = ["paramiko>=3.4"]
dev = [
    "coverage>=7.0",
    "cx-Freeze>=8.4",
    "pytest-cov>=7.0",
    "pytest>=8.0",
    "paramiko>=3.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
operon = "operon.cli:main"

[tool.setuptools.packages.find]
include = ["operon*"]

[tool.cxfreeze]
executables = [
    { script = "operon/__main__.py", target_name = "operon" },
]

[tool.cxfreeze.build_exe]
packages = ["operon", "email", "yaml", "requests", "aiohttp", "Bio", "paramiko", "questionary", "prompt_toolkit", "wcwidth"]
include_files = [
    ["README.md", "share/doc/operon/README.md"],
    ["docs", "share/doc/operon/docs"],
    ["LICENSE", "LICENSE"],
]
excludes = ["pytest", "setuptools", "unittest", "coverage", "pytest-cov"]
optimize = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
addopts = [
    "--cov=operon",
    "--cov-branch",
    "--cov-report=xml",
    "--junitxml=junit.xml",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: isolated domain tests",
    "integration: tests spanning multiple components",
    "regression: correctness regressions",
    "compatibility: supported Python and database compatibility contracts",
]

[tool.coverage.run]
branch = true
source = ["operon"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
]
