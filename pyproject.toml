[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "OperonDBS"
# The application version authority is the annotated, GPG-signed git tag,
# derived at build time by setuptools-scm ([tool.setuptools_scm] below);
# `python -m setuptools_scm` previews the derived value in a checkout.
dynamic = ["version"]
description = "Operon the Database System: Archive, Quality-Control, Organize, Analyze and Release Your Bio-Data"
authors = [
    { name = "hyli360", email = "lihuanyu2003@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]

license = "BSD-2-Clause"
license-files = ["LICENSE"]

dependencies = [
    "aiohttp>=3.9,<4",
    "biopython>=1.85,<2",
    "paramiko>=3.4,<6",
    "polars>=2.0.0,<3",
    "pyarrow>=25.0.0,<27",  # 26.0 needs python 3.11+
    "pysam>=0.24.1,<0.25",  # BGZF via htslib; 0.24.1 adds cp315 wheels
    "PyYAML>=6.0.1,<7",  # 6.0.1 is the first line with cp312 wheels
    "questionary>=2.1,<3",
    "requests>=2.32,<3",
    "textual>=8.0,<9",  # textual has repeatedly broken APIs between minor lines
]

[project.urls]
Repository = "https://github.com/HYLi360/Operon"
Issues = "https://github.com/HYLi360/Operon/issues"

[project.optional-dependencies]
test = [
    "coverage>=7.0",
    "cython>=3.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=3.16",
    "pytest-xdist>=3.8",
    "ruff>=0.16.9,<0.17.0",
    "setuptools>=77",
    "setuptools-scm>=8",
    "textual>=8.0",
]
docs = [
    "Sphinx>=7.4,<9",
    "myst-parser>=4.0,<5",
    "sphinx-rtd-theme>=3.0,<4",
    "setuptools-scm>=8",
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    "coverage>=7.0",
    "cython>=3.0",
    "myst-parser>=4.0,<5",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-randomly>=3.16",
    "pytest-xdist>=3.8",
    "ruff>=0.16.9,<0.17.0",
    "setuptools>=77",
    "setuptools-scm>=8",
    "Sphinx>=7.4,<9",
    "sphinx-rtd-theme>=3.0,<4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
operon = "operon.cli:main"

[tool.setuptools_scm]
# Environments without tag history — PR matrix legs, shallow clones — fall
# back to this placeholder instead of failing their build; release artifacts
# are built from the tagged commit, where the derivation is exact.
fallback_version = "0.0.0"
# Runtime versions come from installed metadata, so no version file exists:
# keep the future no-source-tree-write default in force and silence the
# transition warning (setuptools-scm 10).
write_to_source = false

[tool.setuptools.packages.find]
include = ["operon*"]

[tool.setuptools.package-data]
"operon.contracts" = ["*.json"]
"operon.qc" = ["*.json"]
"operon.tui" = ["*.tcss", "assets/*.png", "assets/*.z", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
addopts = [
    "--cov=operon",
    "--cov-branch",
    "--cov-report=xml:cobertura.xml",
    "--junitxml=junit.xml",
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-n",
    "auto",
    "-o",
    "junit_family=legacy",
]
markers = [
    "unit: isolated domain tests",
    "integration: tests spanning multiple components",
    "regression: correctness regressions",
    "compatibility: supported Python and database compatibility contracts",
    "bug(id): regression test covering a defect registry (defects.yml) entry",
]

[tool.coverage.run]
branch = true
source = ["operon"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 95
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]