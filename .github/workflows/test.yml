name: test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step carries a name that says which command it ran. The run's step list
# is what a red build is triaged from, so a name has to identify the failing
# command on its own — a step that hides pytest behind "Upgrade pip" reads like
# infrastructure trouble instead of a test failure.
# tests/unit/test_ci_workflow_steps.py enforces the rule.
jobs:
  # Documentation is cheap to build and independent of the test matrix, so it
  # runs as its own job in parallel instead of gating the ten test jobs.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out the Repository Code
        uses: actions/checkout@v6
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade the pip Installer
        run: python -m pip install --upgrade pip
      - name: Install Operon With Its Documentation Dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build English Documentation (Strict)
        run: sphinx-build -W --keep-going -b html docs/en docs/_build/en/html
      - name: Build Chinese Documentation (Strict)
        run: sphinx-build -W --keep-going -b html docs/zh docs/_build/zh/html

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest ]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      # The TUI/CLI parity registry carries no `planned` gap: strict mode turns
      # one that reappears into a failure (see tests/unit/test_tui_cli_parity.py).
      OPERON_PARITY_STRICT: "1"
    steps:
      - name: Check Out the Repository Code
        uses: actions/checkout@v6
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          allow-prereleases: true
          check-latest: true
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade the pip Installer
        run: python -m pip install --upgrade pip
      - name: Install Operon With Its Testing Dependencies
        run: python -m pip install -e '.[test]'
      - name: Run the Test Suite With pytest
        run: python -m pytest
      - name: Upload the Coverage Report (Ubuntu 3.12 Only)
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [docs, pytest]
    if: always()
    steps:
      - name: Fail If Any Needed Job Did Not Succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
