name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - name: The tagged commit passed its own CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "no run"')
          echo "$RELEASE_TAG -> $sha: test.yml concluded '$conclusion'"
          if [ "$conclusion" != "success" ]; then
            echo "::error::test.yml on $sha concluded '$conclusion'; rerun it (gh run rerun) before releasing"
            exit 1
          fi
      - name: Import the maintainer's published GPG key
        run: |
          curl -sSL "https://github.com/${{ github.repository_owner }}.gpg" | gpg --import
          gpg --list-keys --with-colons | grep '^pub' | wc -l
      - name: Release preflight
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/release-preflight.sh --ci --tag "$RELEASE_TAG"

  source-distribution:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib;
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          expected = f'v{version}'; actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} does not match {expected!r}'"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  documentation:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[docs]'
      - run: |
          sphinx-build -W --keep-going -b html docs/en docs/_build/en/html
          sphinx-build -W --keep-going -b html docs/zh docs/_build/zh/html

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
            artifact: linux-x86_64
          - os: macos-15-intel
            architecture: x86_64
            artifact: macos-x86_64
          - os: macos-latest
            architecture: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install cibuildwheel==4.2.0
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.architecture }}
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_COMMAND: >-
            python -c "import operon; import operon.qc._parsers;
            import operon.qc._alignment;
            print(operon.__version__)" && operon --help
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-wheel-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pypi-publish:
    needs: [verify-release, source-distribution, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/operondbs/
    permissions:
      # This is a standard OIDC Keyless Authorization Statements,
      # NOT a hardcoding token
      id-token: write  # nosemgrep: security.hard-coded-tokens
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
