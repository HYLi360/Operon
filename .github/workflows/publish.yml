name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Every step carries a name that says which command it ran; together they read as
# the release's checklist in the run's step list, which is where a blocked
# release is triaged from. tests/unit/test_ci_workflow_steps.py enforces it.
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check Out the Tagged Commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip, PyYAML and setuptools-scm
        run: python -m pip install --upgrade pip pyyaml setuptools-scm
      - name: Wait for a Green test.yml Run on the Tagged Commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A commit and its tag pushed together start the test and publish
          # workflows at the same moment, so the run this gate needs is
          # queued or in progress when it first looks: poll until the test
          # run concludes instead of failing on its absence.
          sha=$(git rev-parse HEAD)
          echo "$RELEASE_TAG -> $sha: waiting for test.yml to conclude"
          deadline=$(($(date +%s) + 3600))
          while :; do
            conclusion=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')
            case "$conclusion" in
              success)
                echo "$RELEASE_TAG -> $sha: test.yml concluded 'success'"
                exit 0
                ;;
              failure|cancelled|timed_out|startup_failure)
                echo "::error::test.yml on $sha concluded '$conclusion'; rerun it (gh run rerun), then delete and re-push the tag"
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::test.yml on $sha has not concluded within 60 minutes (last state: '$conclusion'); push the commit to master so CI tests it, then re-push the tag"
              exit 1
            fi
            sleep 30
          done
      - name: Import the Maintainer's Published GPG Key
        run: |
          curl -sSL "https://github.com/${{ github.repository_owner }}.gpg" | gpg --import
          gpg --list-keys --with-colons | grep '^pub' | wc -l
      - name: Run the Release Preflight
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release-preflight.sh --ci --tag "$RELEASE_TAG"

  source-distribution:
    needs: verify-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out the Repository Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Upgrade build, twine and setuptools-scm
        run: python -m pip install --upgrade build twine setuptools-scm
      - name: Verify the Release Tag Matches the Derived Version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, setuptools_scm;
          expected = f'v{setuptools_scm.get_version()}'; actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} does not match {expected!r}'"
      - name: Build the Source Distribution (sdist)
        run: python -m build --sdist
      - name: Check the Source Distribution With twine
        run: python -m twine check dist/*
      - name: Upload the Source Distribution as an Artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  documentation:
    needs: verify-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out the Repository Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade the pip Installer
        run: python -m pip install --upgrade pip
      - name: Install Operon With Its Documentation Dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build English Documentation (Strict)
        run: sphinx-build -W --keep-going -b html docs/en docs/_build/en/html
      - name: Build Chinese Documentation (Strict)
        run: sphinx-build -W --keep-going -b html docs/zh docs/_build/zh/html

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
            artifact: linux-x86_64
          - os: macos-15-intel
            architecture: x86_64
            artifact: macos-x86_64
          - os: macos-latest
            architecture: arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Out the Repository Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set Up the Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Derive the Wheel Version from the Tag
        run: echo "WHEEL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0
      - name: Build the Wheels With cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.architecture }}
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux_*"
          # cibuildwheel builds each wheel from an sdist copy without .git, so
          # setuptools-scm cannot discover the tag there; pin the exact release
          # version instead (the sdist job's tag check and the preflight gate
          # verify the derivation upstream).
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OPERONDBS=$WHEEL_VERSION
          CIBW_TEST_COMMAND: >-
            python -c "import operon; import operon.qc._parsers;
            import operon.qc._alignment;
            print(operon.__version__)" && operon --help
      - name: Upload the Wheels as an Artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-wheel-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pypi-publish:
    needs: [verify-release, source-distribution, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/operondbs/
    permissions:
      # This is a standard OIDC Keyless Authorization Statements,
      # NOT a hardcoding token
      id-token: write  # nosemgrep: security.hard-coded-tokens
    steps:
      - name: Download the Built Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
